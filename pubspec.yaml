name: quanlycongviechoahong
description: "Ứng dụng quản lý công việc và hoa hồng"

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase - Dùng phiên bản ổn định
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # State Management
  provider: ^6.1.2

  # Utils
  uuid: ^4.5.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.5
  geolocator: ^13.0.0
  fluttertoast: ^8.2.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true